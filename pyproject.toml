[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "adasvenv",
    "generated_systems",
    "data",
    "specs",
    "example_specs",
    "benchmark/**/spec",
]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Do not catch blind exception: `Exception`
    "E402",  # Module level import not at top of file (needed for sys.path manipulation in scripts)
    "E501",  # Line too long (handled by ruff format; prompts often exceed 120 chars)
    "S102",  # Use of `exec` detected (essential for the framework, executed inside sandbox)
    "TRY004",  # Prefer `TypeError` exception for invalid type (data/manifest/CLI parsing uses ValueError/RuntimeError)
    "S110",  # `try`-`except`-`pass` detected (intentional for best-effort cleanups, optional imports, and fallback probes)
    "S112",  # `try`-`except`-`continue` detected (intentional when searching/parsing multiple candidates or markdown blocks)
]

[tool.pytest.ini_options]
markers = [
    "container: requires a running Docker or Podman engine",
]

[tool.pyright]
typeCheckingMode = "standard"
reportUnreachable = true
venvPath = "."
venv = "adasvenv"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "adasvenv/**",
    "generated_systems/**",
    "data/**",
    "specs/**",
    "example_specs/**",
    "benchmark/**/spec/**",
]
