name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install ShellCheck 0.9.0
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck=0.9.0-1
        test "$(shellcheck --version | awk '/^version:/ {print $2}')" = "0.9.0"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies and setup venv
      run: |
        python -m pip install --upgrade pip
        python -m venv adasvenv
        source adasvenv/bin/activate
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Ruff Format Check
      run: |
        source adasvenv/bin/activate
        ruff format --check .
        
    - name: Run Ruff Linter
      run: |
        source adasvenv/bin/activate
        ruff check .

    - name: Run Shellcheck
      run: |
        shellcheck scripts/*.sh
      
    - name: Run Pyright
      run: |
        source adasvenv/bin/activate
        pyright

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies and setup venv
      run: |
        python -m pip install --upgrade pip
        python -m venv adasvenv
        source adasvenv/bin/activate
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytest
      run: |
        source adasvenv/bin/activate
        pytest tests -v
